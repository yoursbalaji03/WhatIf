<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>What If? - Decision Simulator</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="page">

    <div class="logo">
        WHAT IF? <span>—</span>
    </div>

    <h1 class="page-title">
        Decision Simulator
    </h1>

    <p class="subtitle">
        Explore different possible outcomes before making a decision.
    </p>


    <div class="card home-card">

        <h2>💭 What are you deciding about?</h2>


        <form action="/simulate" method="POST">


            <div class="form-group">

                <label>
                    Decision
                </label>

                <input
                    type="text"
                    name="decision"
                    placeholder="Example: Buy a laptop"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Current Savings (₹)
                </label>

                <input
                    type="number"
                    name="savings"
                    placeholder="50000"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Monthly Income (₹)
                </label>

                <input
                    type="number"
                    name="income"
                    placeholder="20000"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Monthly Expenses (₹)
                </label>

                <input
                    type="number"
                    name="expenses"
                    placeholder="12000"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Decision Cost (₹)
                </label>

                <input
                    type="number"
                    name="cost"
                    placeholder="70000"
                    min="0"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Simulation Period
                </label>

                <select name="months" required>

                    <option value="3">
                        3 Months
                    </option>

                    <option value="6">
                        6 Months
                    </option>

                    <option value="12">
                        12 Months
                    </option>

                    <option value="24">
                        24 Months
                    </option>

                </select>

            </div>


            <button
                type="submit"
                class="primary-button">

                🚀 SIMULATE DECISION

            </button>

        </form>

    </div>


    <div class="home-links">

        <a
            href="/history"
            class="nav-button">

            📊 Simulation History

        </a>

        <a
            href="/compare"
            class="nav-button">

            ⚖️ Compare Decisions

        </a>

    </div>

</div>

</body>

</html>
