<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Compare Decisions</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="page">

    <div class="logo">
        WHAT IF? <span>—</span>
    </div>

    <h1 class="page-title">
        ⚖️ Compare Decisions
    </h1>

    <p class="subtitle">
        Compare three choices and find the better option.
    </p>


    <div class="compare-card">


        <form action="/compare" method="POST">


            <div class="option-card">

                <h2>
                    Option 1
                </h2>

                <div class="form-group">

                    <label>
                        Decision Name
                    </label>

                    <input
                        type="text"
                        name="decision1"
                        placeholder="Example: iPhone"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Cost (₹)
                    </label>

                    <input
                        type="number"
                        name="cost1"
                        placeholder="70000"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="option-card">

                <h2>
                    Option 2
                </h2>

                <div class="form-group">

                    <label>
                        Decision Name
                    </label>

                    <input
                        type="text"
                        name="decision2"
                        placeholder="Example: Google Pixel"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Cost (₹)
                    </label>

                    <input
                        type="number"
                        name="cost2"
                        placeholder="50000"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="option-card">

                <h2>
                    Option 3
                </h2>

                <div class="form-group">

                    <label>
                        Decision Name
                    </label>

                    <input
                        type="text"
                        name="decision3"
                        placeholder="Example: iQOO"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>
                        Cost (₹)
                    </label>

                    <input
                        type="number"
                        name="cost3"
                        placeholder="30000"
                        min="0"
                        required
                    >

                </div>

            </div>


            <div class="option-card financial-card">

                <h2>
                    💰 Your Financial Details
                </h2>


                <div class="form-group">

                    <label>
                        Current Savings (₹)
                    </label>

                    <input
                        type="number"
                        name="savings"
                        placeholder="50000"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Monthly Income (₹)
                    </label>

                    <input
                        type="number"
                        name="income"
                        placeholder="20000"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Monthly Expenses (₹)
                    </label>

                    <input
                        type="number"
                        name="expenses"
                        placeholder="12000"
                        min="0"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>
                        Simulation Period
                    </label>

                    <input
                        type="number"
                        name="months"
                        placeholder="12"
                        min="1"
                        max="60"
                        required
                    >

                </div>

            </div>


            <button
                type="submit"
                class="primary-button">

                🔍 COMPARE DECISIONS

            </button>

        </form>

    </div>


    <div class="home-links">

        <a href="/" class="nav-button">
            ← Back to Simulator
        </a>

        <a href="/history" class="nav-button">
            📊 History
        </a>

    </div>

</div>

</body>

</html>
